  <title id="infra-name">SETRON 프로그램 연결</title>
  <desc id="infra-desc">열려 있는 Excel에서 읽은 자료를 SETRON.exe로 검토하고 로컬 MySQL 5.6.19에서 조회·저장합니다. AI 기능은 사내 모델 또는 호환 API를 제공하는 상용 모델 중 하나를 선택해 연결합니다.</desc>
