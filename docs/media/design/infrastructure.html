<title id="infra-title">SETRON 인프라 구성</title>
<desc id="infra-desc">현장 PC의 SETRON.exe는 같은 PC의 Excel을 읽고 로컬 MySQL에 연결합니다. 개발 PC에서는 앱과 pytest가 Docker Compose로 분리한 mysql-dev와 mysql-test에 각각 연결합니다. 두 환경의 앱은 필요할 때 OpenAI 호환 API를 호출합니다.</desc>
