<title id="infra-title">SETRON 실행 환경</title>
<desc id="infra-description">현장 Windows PC에 설치된 SETRON.exe는 실행 중인 Excel에서 시트를 읽고 로컬 MySQL 5.6.19를 조회·갱신합니다. AI 추출·질문 해석에는 사내 모델 또는 호환 API를 제공하는 상용 모델 중 설정에 지정한 한 곳을 사용합니다.</desc>

<script>
const diagram=document.querySelector('svg');
const svgBlob=()=>new Blob([new XMLSerializer().serializeToString(diagram)],{type:'image/svg+xml;charset=utf-8'});
function save(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('svg').onclick=()=>save(svgBlob(),'infrastructure.svg');
document.getElementById('png').onclick=async()=>{await document.fonts.ready;const url=URL.createObjectURL(svgBlob());try{const image=new Image();image.src=url;await image.decode();const canvas=document.createElement('canvas');canvas.width=diagram.viewBox.baseVal.width*2;canvas.height=diagram.viewBox.baseVal.height*2;canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>save(blob,'infrastructure.png'))}finally{URL.revokeObjectURL(url)}};
</script></body></html>
