<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="648" viewBox="0 0 1080 648" xml:lang="ko" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">설비 버전 관리 흐름</title>
  <desc id="diagram-desc">Excel의 설비 현황표와 릴리스 노트를 읽고, 원본과 대조한 뒤 PC의 MySQL에 저장한다. SETRON은 저장한 자료로 버전과 위험을 판정한다. 담당자는 결과를 대시보드, 아이템 매니저, 버전 리플레이, 보고서에서 확인한다. 자연어 질의에서는 AI가 조회 조건 해석을 보조한다.</desc>
