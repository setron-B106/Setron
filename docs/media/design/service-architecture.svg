<rect width="1080" height="648" fill="#fff"/>
<text x="36" y="61" class="heading">설비 버전 관리 흐름</text>
<g id="register">
<rect x="36" y="89" width="1008" height="158" rx="14" fill="#f0f5fc" stroke="#d8e4f0" stroke-width="1.2"/>
<text x="58" y="121" class="group">자료 등록</text>
<g id="step-sheet">
<rect x="58" y="139" width="280" height="87" rx="9" class="card"/>
<use class="ico" x="73" y="155" width="23" height="23" xlink:href="#icon-sheet"/>
<text x="106" y="175" class="name">열어 둔 Excel 시트</text>
<text x="74" y="205" class="description">설비 현황표와 릴리스 노트</text>
</g>
<g id="step-review">
<rect x="400" y="139" width="280" height="87" rx="9" class="card"/>
<use class="ico" x="415" y="155" width="23" height="23" xlink:href="#icon-review"/>
<text x="448" y="175" class="name">항목 추출과 원본 검토</text>
<text x="416" y="205" class="description">규칙 또는 AI로 읽고 원본 셀과 대조</text>
</g>
<g id="step-storage">
<rect x="742" y="139" width="280" height="87" rx="9" class="card"/>
<use class="ico" x="757" y="155" width="23" height="23" xlink:href="#icon-storage"/>
<text x="790" y="175" class="name">검토한 자료 저장</text>
<text x="758" y="205" class="description">이 PC의 MySQL에 변경 내용 반영</text>
</g>
<path class="bus" d="M342 183 H394" marker-end="url(#arrow)"/>
<path class="bus" d="M684 183 H736" marker-end="url(#arrow)"/>
</g>
<g id="interpret">
<path class="bus" d="M882 228 V267 H352 V295" marker-end="url(#arrow)"/>
<g id="compare">
<rect x="58" y="302" width="588" height="131" rx="12" fill="#194878"/>
<use class="ico" style="color:#fff" x="81" y="325" width="30" height="30" xlink:href="#icon-analysis"/>
<text x="124" y="348" class="on-blue">버전 비교와 위험 판정</text>
<text x="83" y="382" class="on-blue-body">목표 버전(N)과 관측 버전을 비교해 달성 여부를 계산합니다.</text>
<text x="83" y="408" class="on-blue-body">변경 항목의 적용 여부를 확인하고, 등록한 기준으로 위험을 판정합니다.</text>
</g>
<g id="ai-question">
<rect x="720" y="309" width="302" height="116" rx="10" fill="#f7f9fc" stroke="#cfd9e5" stroke-width="1.25"/>
<use class="ico" x="740" y="326" width="23" height="23" xlink:href="#icon-query"/>
<text x="777" y="346" class="name">자연어로 묻기</text>
<text x="741" y="378" class="description">AI가 질문에서 조회 조건을 찾으면</text>
<text x="741" y="401" class="description">앱이 검증한 조건으로 조회합니다.</text>
</g>
<path class="aux" d="M717 367 H651" marker-end="url(#assist)"/>
</g>
<g id="views">
<path class="bus" d="M352 436 V468"/>
<path class="bus" d="M155 468 H925"/>
<path class="bus" d="M155 468 V498" marker-end="url(#arrow)"/>
<path class="bus" d="M412 468 V498" marker-end="url(#arrow)"/>
<path class="bus" d="M669 468 V498" marker-end="url(#arrow)"/>
<path class="bus" d="M925 468 V498" marker-end="url(#arrow)"/>
<g id="view-status">
<rect x="36" y="504" width="237" height="113" rx="9" fill="#f6f9fd" stroke="#c9d8e8" stroke-width="1.3"/>
<use class="ico" x="52" y="520" width="22" height="22" xlink:href="#icon-status"/>
<text x="85" y="539" class="feature">대시보드 · 히트맵</text>
<text x="51" y="571" class="description">사업장·라인별 목표 달성률과</text>
<text x="51" y="595" class="description">위험 후보 설비 확인</text>
</g>
<g id="view-items">
<rect x="293" y="504" width="237" height="113" rx="9" fill="#f6f9fd" stroke="#c9d8e8" stroke-width="1.3"/>
<use class="ico" x="309" y="520" width="22" height="22" xlink:href="#icon-items"/>
<text x="342" y="539" class="feature">아이템 매니저</text>
<text x="308" y="571" class="description">변경 항목을 검색해 적용된</text>
<text x="308" y="595" class="description">릴리스와 설비 확인</text>
</g>
<g id="view-replay">
<rect x="550" y="504" width="237" height="113" rx="9" fill="#f6f9fd" stroke="#c9d8e8" stroke-width="1.3"/>
<use class="ico" x="566" y="520" width="22" height="22" xlink:href="#icon-replay"/>
<text x="599" y="539" class="feature">버전 리플레이</text>
<text x="565" y="571" class="description">관측일별로 기록을 재생해</text>
<text x="565" y="595" class="description">달성률과 버전 분포 비교</text>
</g>
<g id="view-report">
<rect x="807" y="504" width="237" height="113" rx="9" fill="#f6f9fd" stroke="#c9d8e8" stroke-width="1.3"/>
<use class="ico" x="823" y="520" width="22" height="22" xlink:href="#icon-report"/>
<text x="856" y="539" class="feature">보고서 · 내보내기</text>
<text x="822" y="571" class="description">Word·PDF 보고서 저장과</text>
<text x="822" y="595" class="description">히트맵 Excel 내보내기</text>
</g>
</g>
</svg>
